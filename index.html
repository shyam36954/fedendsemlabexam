<!DOCTYPE html>
<html>
<head>
  <title>Student College Home Page</title>
  <!-- Connects your separate CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Welcome to College Home Page</h1>
  <a href="#"></a>
  <table class="table" border="1" cellspacing="0">
    <thead>
      <tr>
        <th>Subject</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>English</td>
        <td>9:30-11:30</td>
      </tr>
      <tr>
        <td>Java</td>
        <td>11:40-12:50</td>
      </tr>
      <tr>
        <td>Python</td>
        <td>14:10-15:30</td>
      </tr>
      <tr>
        <td>JavaScript</td>
        <td>15:40-16:30</td>
      </tr>
    </tbody>
  </table>
  <form class="flexbox">
    <input type="text" placeholder="Enter Your Student Name">
    <input type="text" placeholder="Enter your ID Number">
    <button type="submit">Submit</button>
  </form>

</body>
</html>
